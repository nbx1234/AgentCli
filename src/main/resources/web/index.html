<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentCli · ReAct Timeline</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e6e9ef;
      --muted: #8b93a3;
      --blue: #3b82f6;
      --orange: #f59e0b;
      --green: #22c55e;
      --grey: #6b7280;
      --cyan: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky; top: 0;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    header .title { font-weight: 700; }
    #dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--grey);
      display: inline-block;
    }
    #dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #dot.off { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
    #count {
      background: var(--border); color: var(--text);
      border-radius: 999px; padding: 1px 8px; font-size: 12px;
    }
    button {
      margin-left: auto;
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 12px; cursor: pointer; font-family: inherit;
    }
    button:hover { color: var(--text); border-color: var(--muted); }
    main { padding: 12px 16px 40px; max-width: 980px; margin: 0 auto; }
    /* Day 12：DAG 面板 */
    #dag-panel {
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--panel); margin: 8px 0 16px; overflow-x: auto;
    }
    #dag-panel[hidden] { display: none; }
    #dag-panel .hd {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 13px;
    }
    #dag-panel .hd .hint { color: var(--muted); font-size: 11px; }
    #dag-panel svg { display: block; min-width: 460px; }
    #dag-panel text { fill: var(--text); font-size: 11px; font-family: inherit; }
    .card {
      border: 1px solid var(--border);
      border-left: 3px solid var(--grey);
      background: var(--panel);
      border-radius: 6px;
      margin: 8px 0; padding: 8px 12px;
      word-break: break-word;
    }
    .card .head { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
    .card .tag {
      font-size: 11px; font-weight: 700; color: #fff;
      border-radius: 4px; padding: 1px 6px; white-space: nowrap;
    }
    .card .meta { color: var(--muted); font-size: 11px; }
    .card .body { margin-top: 6px; font-size: 13px; color: var(--text); }
    .card .body pre {
      margin: 6px 0 0; padding: 6px 8px; background: #0b0d12;
      border-radius: 4px; overflow-x: auto; font-family: inherit; font-size: 12px;
    }
    /* type 配色 */
    .t-turn_start   .tag { background: var(--blue); }
    .t-tool_call    .tag { background: var(--orange); }
    .t-tool_result  .tag { background: var(--grey); }
    .t-turn_end     .tag { background: var(--green); }
    .t-llm_start .tag, .t-llm_end .tag, .t-llm_call .tag { background: var(--cyan); }
    .t-hello        .tag { background: var(--grey); }
    pre.reasoning { color: var(--muted); font-style: italic; }
    /* tool_result 默认折叠 */
    .collapsible .body { display: none; }
    .collapsible.open .body { display: block; }
    .collapsible .head { cursor: pointer; }
    .card small { color: var(--muted); }
    #empty { color: var(--muted); text-align: center; margin-top: 60px; }
  </style>
</head>
<body>
  <header>
    <span class="title">AgentCli</span>
    <span id="dot"></span>
    <span id="status">connecting…</span>
    <span id="count">0</span>
    <button id="dag-btn">dag</button>
    <button id="clear-btn">clear</button>
  </header>
  <main id="timeline">
    <div id="dag-panel" hidden>
      <div class="hd"><span>计划 DAG</span><span class="hint">/api/dag</span></div>
      <svg id="dag"></svg>
    </div>
    <p id="empty">等待事件…</p>
  </main>

  <script>
    const timeline = document.getElementById('timeline');
    const dot = document.getElementById('dot');
    const statusEl = document.getElementById('status');
    const countEl = document.getElementById('count');
    const clearBtn = document.getElementById('clear-btn');
    let count = 0;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function time() {
      const d = new Date();
      return d.toTimeString().slice(0, 8);
    }
    function addCard(type, title, bodyHtml, collapsible) {
      const empty = document.getElementById('empty');
      if (empty) empty.remove();
      const card = document.createElement('div');
      card.className = 'card t-' + type + (collapsible ? ' collapsible' : '');
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = '<span class="tag">' + esc(type) + '</span>'
        + '<span class="meta">' + time() + '</span>'
        + '<span>' + esc(title) + '</span>';
      card.appendChild(head);
      if (bodyHtml) {
        const body = document.createElement('div');
        body.className = 'body';
        body.innerHTML = bodyHtml;
        card.appendChild(body);
      }
      if (collapsible) {
        head.addEventListener('click', () => card.classList.toggle('open'));
      }
      timeline.appendChild(card);
      // 只保留最近 200 条
      while (timeline.children.length > 200) timeline.removeChild(timeline.firstChild);
      timeline.scrollTop = timeline.scrollHeight;
    }

    function setConnected(ok) {
      dot.className = ok ? 'on' : 'off';
      statusEl.textContent = ok ? 'connected' : 'disconnected';
    }

    // ---- Day 12：DAG（分层布局，SVG）----
    const dagPanel = document.getElementById('dag-panel');
    const dagSvg = document.getElementById('dag');
    const dagBtn = document.getElementById('dag-btn');
    function dagDepth(nodes, edges) {
      const adj = {}; nodes.forEach(n => adj[n.id] = []);
      edges.forEach(e => adj[e.from].push(e.to));
      const depth = {}; nodes.forEach(n => depth[n.id] = 0);
      for (const n of nodes) {
        for (const to of adj[n.id]) depth[to] = Math.max(depth[to], depth[n.id] + 1);
      }
      return depth;
    }
    function statusColor(s) {
      return ({PENDING:'#6b7280', RUNNING:'#3b82f6', DONE:'#22c55e', FAILED:'#ef4444', SKIPPED:'#6b7280'})[s] || '#6b7280';
    }
    function loadDag() {
      fetch('/api/dag').then(r => r.json()).then(data => {
        const nodes = data.nodes || [], edges = data.edges || [];
        if (!nodes.length) { dagPanel.hidden = true; return; }
        dagPanel.hidden = false;
        const depth = dagDepth(nodes, edges);
        // 按深度分层：每层节点最多时决定层高
        const byDepth = {};
        nodes.forEach(n => (byDepth[depth[n.id]] = byDepth[depth[n.id]] || []).push(n.id));
        const NW = 150, NH = 34, GX = 50, GY = 18;
        const pos = {};
        Object.keys(byDepth).forEach(d => {
          byDepth[d].forEach((id, i) => pos[id] = {
            x: +d * (NW + GX),
            y: i * (NH + GY)
          });
        });
        const W = nodes.reduce((m, n) => Math.max(m, pos[n.id].x + NW), 0) + 20;
        const H = nodes.reduce((m, n) => Math.max(m, pos[n.id].y + NH), 0) + 20;
        const posById = id => {
          const p = pos[id]; return { cx: p.x + NW / 2, cy: p.y + NH / 2 };
        };
        const sx = x => Math.round(100 + x), sy = y => Math.round(20 + y);
        let svg = `<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b93a3"/></marker></defs>`;
        edges.forEach(e => {
          const b = posById(e.from), t = posById(e.to);
          svg += `<line x1="${sx(b.cx)}" y1="${sy(b.cy)}" x2="${sx(t.cx)}" y2="${sy(t.cy)}" stroke="#8b93a3" stroke-width="1.5" marker-end="url(#arr)"/>`;
        });
        nodes.forEach(n => {
          const c = statusColor(n.status);
          const p = pos[n.id];
          svg += `<rect x="${sx(p.x)}" y="${sy(p.y)}" width="${NW}" height="${NH}" rx="6" fill="#1b1f29" stroke="${c}" stroke-width="1.5"/>`
            + `<text x="${sx(p.x) + 8}" y="${sy(p.y) + 15}">${esc(n.id)} · ${esc(n.title)}</text>`
            + `<text x="${sx(p.x) + 8}" y="${sy(p.y) + NH - 6}" fill="${c}" font-size="9">${esc(n.status)}</text>`;
        });
        dagSvg.setAttribute('width', (100 + W + 20));
        dagSvg.setAttribute('height', (20 + H + 20));
        dagSvg.innerHTML = svg;
      }).catch(() => dagPanel.hidden = true);
    }
    dagBtn.addEventListener('click', loadDag);
    loadDag(); // 首屏即拉取当前计划

    const es = new EventSource('/api/events');
    es.onopen = () => setConnected(true);
    es.onerror = () => setConnected(false); // 断线；EventSource 自动重连，不手动 retry

    es.addEventListener('hello', e => {
      count++; countEl.textContent = count;
      addCard('hello', '已连接事件流', '<small>' + esc(e.data) + '</small>');
    });
    es.addEventListener('turn_start', e => {
      count++; countEl.textContent = count;
      const p = JSON.parse(e.data);
      addCard('turn_start', 'turn start', '<pre>' + esc(p.input) + '</pre>');
    });
    function renderDuration(p) { return p.durationMs + 'ms'; }
    es.addEventListener('llm_start', e => {
      count++; countEl.textContent = count;
      const p = JSON.parse(e.data);
      addCard('llm_start', 'LLM 思考 #' + (p.iteration || '?'));
    });
    es.addEventListener('llm_end', e => {
      count++; countEl.textContent = count;
      const p = JSON.parse(e.data);
      const head = 'LLM 返回 #' + (p.iteration || '?') + ' · ' + renderDuration({durationMs: p.durationMs});
      addCard('llm_end', head, p.preview ? '<pre class="reasoning">' + esc(p.preview) + '</pre>' : null, true);
    });
    es.addEventListener('tool_call', e => {
      count++; countEl.textContent = count;
      const p = JSON.parse(e.data);
      addCard('tool_call', '调用 ' + esc(p.tool),
        '<pre>' + esc(p.preview || p.args) + '</pre>');
    });
    es.addEventListener('tool_result', e => {
      count++; countEl.textContent = count;
      const p = JSON.parse(e.data);
      const head = '结果 ' + esc(p.tool) + ' · ' + renderDuration(p);
      addCard('tool_result', head, '<pre>' + esc(p.result || '') + '</pre>', true);
    });
    // 回答逐字出现：累积到一个"正在回答"卡片
    let typingCard = null;
    es.addEventListener('answer_delta', e => {
      count++; countEl.textContent = count;
      const p = JSON.parse(e.data);
      if (!typingCard) {
        const empty = document.getElementById('empty');
        if (empty) empty.remove();
        typingCard = document.createElement('div');
        typingCard.className = 'card t-turn_end typing';
        typingCard.innerHTML = '<div class="head"><span class="tag">turn_end</span>'
          + '<span class="meta">' + time() + '</span><span>回答中…</span></div>'
          + '<div class="body"><pre></pre></div>';
        timeline.appendChild(typingCard);
      }
      typingCard.querySelector('pre').textContent = p.text;
      timeline.scrollTop = timeline.scrollHeight;
    });
    es.addEventListener('turn_end', e => {
      count++; countEl.textContent = count;
      const p = JSON.parse(e.data);
      if (typingCard) { typingCard.remove(); typingCard = null; }
      addCard('turn_end', '答复', '<pre>' + esc(p.answer) + '</pre>');
    });
    // 兜底：收到未注册的事件时也尝试渲染
    es.onmessage = e => {
      if (!e.data) return;
      try { const p = JSON.parse(e.data); addCard('unknown', p.type || 'event', '<pre>' + esc(e.data) + '</pre>'); }
      catch (_) {}
    };

    clearBtn.addEventListener('click', () => {
      timeline.innerHTML = '';
      count = 0; countEl.textContent = '0';
      timeline.innerHTML = '<p id="empty">等待事件…</p>';
    });
  </script>
</body>
</html>
